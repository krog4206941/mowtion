name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and PyInstaller
        run: pip install -e . pyinstaller
      - name: Build app folder
        run: pyinstaller packaging/mowtion.spec
      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y
      - name: Compile installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" packaging\mowtion.iss
      - uses: actions/upload-artifact@v4
        with:
          name: mowtion-windows
          path: dist/mowtion-setup.exe

  build-macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e . pyinstaller
      - name: Build app
        run: pyinstaller packaging/mowtion.spec
      - name: Make dmg
        run: |
          hdiutil create -volname "mowtion" -srcfolder dist/mowtion.app -ov -format UDZO dist/mowtion-macos.dmg
      - uses: actions/upload-artifact@v4
        with:
          name: mowtion-macos
          path: dist/mowtion-macos.dmg

  release:
    needs: [build-windows, build-macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/mowtion-windows/mowtion-setup.exe
            dist/mowtion-macos/mowtion-macos.dmg
          generate_release_notes: true
